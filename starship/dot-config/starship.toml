format = """
$username\
$hostname\
$directory\
$vcs\
$nix_shell\
$docker_context\
$rust\
$golang\
$zig\
$python\
$lua\
$c\
$haskell\
$package\
$fill\
$cmd_duration\
$line_break\
$status\
$character\
"""

[directory]
truncation_length = 0
truncation_symbol = '…/'
fish_style_pwd_dir_length = 1

[git_metrics]
disabled = false

[vcs]
order = ["jj", "git"]

[fill]
symbol = ' '

[cmd_duration]
format = '[⏱️$duration]($style)'
min_time = 1000

[status]
disabled = false
format = '[$status]($style)'

[nix_shell]
format = '[$symbol$state(\($name\))]($style) '
symbol = '❄️'

[docker_context]
format = '[$symbol$context]($style) '
symbol = '🐳'

[rust]
format = '[$symbol($version)]($style) '
symbol = '🦀'

[golang]
format = '[$symbol($version)]($style) '
symbol = '🐹'

[zig]
format = '[$symbol($version)]($style) '
symbol = '↯'

[python]
format = '[${symbol}(${version})(\($virtualenv\))]($style) '
symbol = '🐍'
pyenv_version_name = true

[lua]
format = '[$symbol($version)]($style) '
symbol = '🌙'

[c]
format = '[$symbol($version(-$name))]($style) '
symbol = 'C'

[haskell]
format = '[$symbol($version)]($style) '
symbol = 'λ'

[package]
format = '[$symbol$version]($style) '
symbol = '📦'
